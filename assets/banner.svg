<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ultron MCP</title>
  <desc id="d">Analyze. Clone. Verify. Build. A local-first MCP toolkit for understanding, cloning and scaffolding software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
    <radialGradient id="glow" cx="250" cy="200" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d3d" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff4d3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1ee"/>
      <stop offset=".4" stop-color="#ff6a5c"/>
      <stop offset="1" stop-color="#ff4d3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d3d"/>
      <stop offset="1" stop-color="#ff4d3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- emblem -->
  <circle cx="250" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="60s" repeatCount="indefinite"/>
    <circle cx="250" cy="200" r="120" fill="none" stroke="#ff4d3d" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="250" cy="80" r="4" fill="#ff4d3d"/>
    <circle cx="370" cy="200" r="3" fill="#ffffff" fill-opacity=".5"/>
    <circle cx="165" cy="285" r="3" fill="#ffffff" fill-opacity=".5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 250 200" to="0 250 200" dur="45s" repeatCount="indefinite"/>
    <circle cx="250" cy="200" r="90" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <path d="M250 110L340 200L250 290L160 200Z" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
    <g stroke="#ff4d3d" stroke-opacity=".4">
      <line x1="250" y1="200" x2="250" y2="110"/>
      <line x1="250" y1="200" x2="340" y2="200"/>
      <line x1="250" y1="200" x2="250" y2="290"/>
      <line x1="250" y1="200" x2="160" y2="200"/>
    </g>
    <g fill="#0a0c11" stroke="#ff4d3d" stroke-width="2">
      <circle cx="250" cy="110" r="6"/>
      <circle cx="340" cy="200" r="6"/>
      <circle cx="250" cy="290" r="6"/>
      <circle cx="160" cy="200" r="6"/>
    </g>
  </g>
  <circle cx="250" cy="200" r="44" fill="url(#core)">
    <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="200" r="13" fill="#ff4d3d"/>
  <circle cx="250" cy="200" r="5" fill="#fff1ee"/>

  <!-- text -->
  <text x="470" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="12" fill="#f4f6fa">ULTRON<tspan fill="#ff4d3d" dx="18">MCP</tspan></text>
  <rect x="472" y="212" width="380" height="2" fill="url(#rule)"/>
  <text x="472" y="252" font-family="'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="24" letter-spacing="2" fill="#aab2c5">Analyze. Clone. Verify. Build.</text>
  <text x="472" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#7f879b">A local-first MCP toolkit for understanding, cloning and scaffolding software.</text>
</svg>
